name: Connector image check

# Builds the connector named by the base branch (rb/<connector>-base) and reads
# its spec with daemonless podman, so the base image pull runs inside the job.
# Push runs record the base; pull request runs record the change.
on:
  workflow_dispatch:
  push:
    branches:
      - 'rb/*-base'
  pull_request:
    branches:
      - 'rb/*-base'

permissions: {}

concurrency:
  group: connector-image-check-${{ github.event.pull_request.number || github.sha }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  image-check:
    name: Build image and read spec
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      BASE_REF: ${{ github.base_ref || github.ref_name }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Resolve connector
        id: connector
        run: |
          name="${BASE_REF#rb/}"
          name="${name%-base}"
          if ! [[ "$name" =~ ^source-[a-z0-9-]+$ ]] || [ ! -f "airbyte-integrations/connectors/$name/metadata.yaml" ]; then
            echo "no source connector for base branch $BASE_REF" >&2
            exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"

      # OIDC exchange; no token to configure.
      - uses: garnet-org/action@673a06d87748bec49e4d8df22d371b2a3420aba4 # v2.5.2

      - name: Build connector image
        working-directory: airbyte-integrations/connectors/${{ steps.connector.outputs.name }}
        run: |
          base_image="$(yq -r '.data.connectorBuildOptions.baseImage' metadata.yaml)"
          echo "base image: $base_image"
          podman build --file "$GITHUB_WORKSPACE/docker-images/Dockerfile.manifest-only-connector" \
            --build-arg BASE_IMAGE="$base_image" --tag localhost/connector:ci .

      - name: Read connector spec
        run: podman run --rm localhost/connector:ci spec

      - name: Let processes settle
        if: always()
        run: sleep 30
